<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝備成本計算機 v4 (嚴謹細節版)</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1f1f23;
            --text-main: #e0e0e0;
            --accent-a: #ff6b6b; 
            --accent-b: #339af0;
            --input-bg: #2b2b30;
            --sim-btn: #fcc419;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        h1 { text-align: center; font-weight: 300; margin-bottom: 5px; color: #fff; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 350px;
            border-top: 4px solid #555;
            position: relative;
        }

        .card.equip-a { border-top-color: var(--accent-a); }
        .card.equip-b { border-top-color: var(--accent-b); }

        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.3em; display: flex; justify-content: space-between; align-items: center; }
        .equip-a h2 { color: var(--accent-a); }
        .equip-b h2 { color: var(--accent-b); }
        
        .badge { font-size: 0.6em; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #aaa; }

        .section {
            margin-bottom: 12px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 2px solid #444;
        }
        
        /* 黃色邊框代表有懲罰機制 */
        .section.penalty-zone { border-left-color: #ffda6b; background: rgba(255, 218, 107, 0.05); }
        .section.skipped { opacity: 0.4; text-align: center; padding: 15px; border-style: dashed; }

        .section-title {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .penalty-tag { color: #ffda6b; font-size: 0.9em; }

        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            align-items: center;
            font-size: 0.95em;
        }

        label { color: #ccc; }

        input {
            background: var(--input-bg);
            border: 1px solid #444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            width: 70px;
            text-align: right;
            font-family: monospace;
            font-size: 1.1em;
        }
        
        input:focus { border-color: #888; outline: none; }

        .result-area {
            margin-top: 20px;
            padding: 15px;
            background: #151518;
            border-radius: 8px;
        }

        .ev-box {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        
        .ev-label { font-size: 0.8em; color: #666; display: block; margin-bottom: 5px; }
        .ev-value { font-size: 2em; font-weight: bold; display: block; color: #fff; }

        .sim-box { text-align: center; }
        
        .sim-btn {
            background-color: var(--sim-btn);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(252, 196, 25, 0.2);
            transition: all 0.2s;
            margin-top: 30px;
            margin-bottom: 50px;
        }
        
        .sim-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(252, 196, 25, 0.3); }
        .sim-btn:active { transform: translateY(1px); }

        .sim-result { font-size: 1.5em; font-weight: bold; min-height: 1.5em; margin-top: 5px; }
        .sim-detail { font-size: 0.85em; color: #888; margin-top: 5px; }

        .lucky { color: #51cf66; }
        .unlucky { color: #ff6b6b; }
        
        .winner-tag { display: inline-block; background: #51cf66; color: #000; font-size: 0.4em; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 10px; opacity: 0; transition: opacity 0.3s;}
        .show-winner { opacity: 1; }

        /* Tooltip for penalty */
        .penalty-info { font-size: 0.75em; color: #ffda6b; margin-top: -4px; margin-bottom: 8px; text-align: right; opacity: 0.8;}

    </style>
</head>
<body>

    <h1>裝備成本計算機 v4</h1>
    <p class="subtitle">已加入「階段一」的額外懲罰機制</p>

    <div class="container">
        <div class="card equip-a">
            <h2>方案 A <span class="badge">多一關卡</span> <span id="win_a" class="winner-tag">期望值較低</span></h2>
            
            <div class="section penalty-zone">
                <div class="section-title">Step 1: 紅 -> 藍 <span class="penalty-tag">⚠</span></div>
                <div class="input-group"><label>前5次成本</label><input type="number" id="a_s1_cost" value="10" onchange="calculateEV()"></div>
                <div class="input-group"><label>第6次起(+2)</label><input type="number" id="a_s1_penalty_total" value="12" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="a_s1_prob" value="30" onchange="calculateEV()"></div>
            </div>

            <div class="section penalty-zone">
                <div class="section-title">Step 1.5: 額外關卡 <span class="penalty-tag">⚠</span></div>
                <div class="input-group"><label>前5次成本</label><input type="number" id="a_s15_cost" value="8" onchange="calculateEV()"></div>
                <div class="input-group"><label>第6次起(+8)</label><input type="number" id="a_s15_penalty_total" value="16" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="a_s15_prob" value="40" onchange="calculateEV()"></div>
            </div>

            <div class="section">
                <div class="section-title">Step 2: 超越 (需5勝)</div>
                <div class="input-group"><label>成本 (億)</label><input type="number" id="a_s2_cost" value="8" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="a_s2_prob" value="50" onchange="calculateEV()"></div>
            </div>

            <div class="section penalty-zone">
                <div class="section-title">Step 3: 再進階 <span class="penalty-tag">⚠</span></div>
                <div class="input-group"><label>前5次成本</label><input type="number" id="a_s3_base" value="8" onchange="calculateEV()"></div>
                <div class="input-group"><label>第6次起(+50)</label><input type="number" id="a_s3_penalty_total" value="58" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="a_s3_prob" value="7" onchange="calculateEV()"></div>
            </div>

            <div class="result-area">
                <div class="ev-box">
                    <span class="ev-label">數學期望值</span>
                    <span class="ev-value" id="a_ev">0 億</span>
                </div>
                <div class="sim-box">
                    <div id="a_sim_res" class="sim-result">---</div>
                </div>
            </div>
        </div>

        <div class="card equip-b">
            <h2>方案 B <span class="badge">捷徑路線</span> <span id="win_b" class="winner-tag">期望值較低</span></h2>
            
            <div class="section penalty-zone">
                <div class="section-title">Step 1: 紅 -> 藍 <span class="penalty-tag">⚠</span></div>
                <div class="input-group"><label>前5次成本</label><input type="number" id="b_s1_cost" value="10" onchange="calculateEV()"></div>
                <div class="input-group"><label>第6次起(+2)</label><input type="number" id="b_s1_penalty_total" value="12" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="b_s1_prob" value="8" onchange="calculateEV()"></div>
            </div>

            <div class="section skipped">
                <div class="section-title" style="justify-content:center;">Step 1.5: 跳過此階段</div>
            </div>

            <div class="section">
                <div class="section-title">Step 2: 超越 (需5勝)</div>
                <div class="input-group"><label>成本 (億)</label><input type="number" id="b_s2_cost" value="50" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="b_s2_prob" value="50" onchange="calculateEV()"></div>
            </div>

            <div class="section penalty-zone">
                <div class="section-title">Step 3: 再進階 <span class="penalty-tag">⚠</span></div>
                <div class="input-group"><label>前5次成本</label><input type="number" id="b_s3_base" value="8" onchange="calculateEV()"></div>
                <div class="input-group"><label>第6次起(+8)</label><input type="number" id="b_s3_penalty_total" value="16" onchange="calculateEV()"></div>
                <div class="input-group"><label>機率 (%)</label><input type="number" id="b_s3_prob" value="10" onchange="calculateEV()"></div>
            </div>

            <div class="result-area">
                <div class="ev-box">
                    <span class="ev-label">數學期望值</span>
                    <span class="ev-value" id="b_ev">0 億</span>
                </div>
                <div class="sim-box">
                    <div id="b_sim_res" class="sim-result">---</div>
                </div>
            </div>
        </div>
    </div>

    <div style="text-align: center;">
        <button class="sim-btn" onclick="runSimulation()">🎲 模擬製作一次 (看運氣)</button>
        <div id="sim_conclusion" style="color: #ccc; margin-bottom: 50px; font-size: 1.1em;"></div>
    </div>

    <script>
        function getVal(id) { return Number(document.getElementById(id).value); }

        function calcStageEV_Simple(cost, prob, winsNeeded) {
            if(prob <= 0) return 0;
            return (winsNeeded / (prob/100)) * cost;
        }

        // 懲罰模式計算：前5次 baseCost，第6次起 newCost
        function calcStageEV_Penalty(baseCost, newCost, prob) {
            let p = prob / 100;
            if(p <= 0) return 0;
            let q = 1 - p;

            // 1. 前5次就成功的加權成本
            let term1 = 0; 
            for(let k=1; k<=5; k++) {
                term1 += baseCost * Math.pow(q, k-1);
            }
            
            // 2. 超過5次才成功的加權成本 (從第6次開始每次都要付 newCost)
            // 公式：newCost * q^5 * (1/p)
            let term2 = newCost * Math.pow(q, 5) * (1/p);

            return term1 + term2;
        }

        function calculateEV() {
            // --- Plan A ---
            let a_ev = 0;
            // S1: Penalty (base 10, new 12)
            a_ev += calcStageEV_Penalty(getVal('a_s1_cost'), getVal('a_s1_penalty_total'), getVal('a_s1_prob'));
            // S1.5: Penalty (base 8, new 16)
            a_ev += calcStageEV_Penalty(getVal('a_s15_cost'), getVal('a_s15_penalty_total'), getVal('a_s15_prob'));
            // S2: 50% x5
            a_ev += calcStageEV_Simple(getVal('a_s2_cost'), getVal('a_s2_prob'), 5);
            // S3: Penalty (base 8, new 58)
            a_ev += calcStageEV_Penalty(getVal('a_s3_base'), getVal('a_s3_penalty_total'), getVal('a_s3_prob'));

            // --- Plan B ---
            let b_ev = 0;
            // S1: Penalty (base 10, new 12) <-- B 在這裡很容易觸發
            b_ev += calcStageEV_Penalty(getVal('b_s1_cost'), getVal('b_s1_penalty_total'), getVal('b_s1_prob'));
            // S2: 50% x5
            b_ev += calcStageEV_Simple(getVal('b_s2_cost'), getVal('b_s2_prob'), 5);
            // S3: Penalty (base 8, new 16)
            b_ev += calcStageEV_Penalty(getVal('b_s3_base'), getVal('b_s3_penalty_total'), getVal('b_s3_prob'));

            // UI Update
            document.getElementById('a_ev').innerText = Math.round(a_ev).toLocaleString() + " 億";
            document.getElementById('b_ev').innerText = Math.round(b_ev).toLocaleString() + " 億";

            // Winner Tag
            document.getElementById('win_a').classList.remove('show-winner');
            document.getElementById('win_b').classList.remove('show-winner');
            if(a_ev < b_ev) document.getElementById('win_a').classList.add('show-winner');
            if(b_ev < a_ev) document.getElementById('win_b').classList.add('show-winner');

            return { a: a_ev, b: b_ev };
        }

        function simulateStage(baseCost, newCost, probPct, winsNeeded, hasPenalty) {
            let totalCost = 0;
            for(let w=0; w<winsNeeded; w++) {
                let success = false;
                let tries = 0;
                while(!success) {
                    tries++;
                    let currentCost = baseCost;
                    if(hasPenalty && tries > 5) {
                        currentCost = newCost;
                    }
                    totalCost += currentCost;
                    
                    if(Math.random()*100 < probPct) success = true;
                }
            }
            return totalCost;
        }

        function runSimulation() {
            // A
            let a = 0;
            a += simulateStage(getVal('a_s1_cost'), getVal('a_s1_penalty_total'), getVal('a_s1_prob'), 1, true);
            a += simulateStage(getVal('a_s15_cost'), getVal('a_s15_penalty_total'), getVal('a_s15_prob'), 1, true);
            a += simulateStage(getVal('a_s2_cost'), 0, getVal('a_s2_prob'), 5, false);
            a += simulateStage(getVal('a_s3_base'), getVal('a_s3_penalty_total'), getVal('a_s3_prob'), 1, true);

            // B
            let b = 0;
            b += simulateStage(getVal('b_s1_cost'), getVal('b_s1_penalty_total'), getVal('b_s1_prob'), 1, true);
            b += simulateStage(getVal('b_s2_cost'), 0, getVal('b_s2_prob'), 5, false);
            b += simulateStage(getVal('b_s3_base'), getVal('b_s3_penalty_total'), getVal('b_s3_prob'), 1, true);

            // Display
            let evs = calculateEV();
            
            updateSimRes('a', a, evs.a);
            updateSimRes('b', b, evs.b);

            let diff = Math.abs(a - b);
            let winner = a < b ? "方案 A" : "方案 B";
            document.getElementById('sim_conclusion').innerText = 
                `本次模擬結果：${winner} 比較省錢，省了 ${Math.round(diff)} 億`;
        }

        function updateSimRes(prefix, val, ev) {
            let el = document.getElementById(prefix + '_sim_res');
            el.innerText = Math.round(val).toLocaleString() + " 億";
            el.className = "sim-result " + (val < ev ? "lucky" : "unlucky");
        }

        // Init
        calculateEV();
    </script>
</body>
</html>
