<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝備運氣模擬器 v6 (詳細帳單)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-a: #ff8787; 
            --accent-b: #74c0fc;
            --gold: #ffd43b;
            --green: #69db7c;
            --red: #ff6b6b;
            --dark-red: #c92a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        h1 { text-align: center; font-weight: 300; margin-bottom: 5px; color: #fff; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 350px;
            border-top: 4px solid #555;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card.equip-a { border-top-color: var(--accent-a); }
        .card.equip-b { border-top-color: var(--accent-b); }

        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.3em; color: #fff; }
        .equip-a h2 { color: var(--accent-a); }
        .equip-b h2 { color: var(--accent-b); }

        /* 設定區塊折疊/展開 */
        .settings-toggle {
            cursor: pointer;
            color: #666;
            font-size: 0.8em;
            text-align: right;
            margin-bottom: 10px;
            text-decoration: underline;
        }
